# ClusterFuzzLite batch fuzzing: every 6 hours, an hour per sanitizer on
# all of the runner's cores. The corpus carries over between runs (kept as
# GitHub artifacts), so fuzzing accumulates; crashes are uploaded as
# artifacts. Pruning and coverage run in cflite_cron.yml.
name: ClusterFuzzLite batch fuzzing
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: read-all
jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
    - name: Build fuzzers (${{ matrix.sanitizer }})
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: c
        sanitizer: ${{ matrix.sanitizer }}
    - name: Run fuzzers (${{ matrix.sanitizer }})
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 3600
        mode: 'batch'
        sanitizer: ${{ matrix.sanitizer }}
        parallel-fuzzing: true
