# ClusterFuzzLite daily tasks: prune the corpus batch fuzzing grows (keeping
# its coverage), and build a coverage report (uploaded as an artifact).
name: ClusterFuzzLite cron tasks
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions: read-all
jobs:
  Pruning:
    runs-on: ubuntu-latest
    steps:
    - name: Build fuzzers
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: c
    - name: Run fuzzers
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 600
        mode: 'prune'
  Coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Build fuzzers
      uses: google/clusterfuzzlite/actions/build_fuzzers@v1
      with:
        language: c
        sanitizer: coverage
    - name: Run fuzzers
      uses: google/clusterfuzzlite/actions/run_fuzzers@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 600
        mode: 'coverage'
        sanitizer: 'coverage'
