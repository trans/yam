name: Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git make gcc

      - uses: actions/checkout@v5

      - name: Verify version matches tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(make version)"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match yam.h version v$version"
            exit 1
          fi

      - name: Build source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make dist DISTDIR=pkg

      - name: Build package with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/pkg' && makepkg -f --noconfirm"

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v6
        with:
          name: yam-arch
          path: pkg/*.pkg.tar.zst

  deb:
    name: Debian packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dpkg-dev

      - name: Verify version matches tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(make version)"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match yam.h version v$version"
            exit 1
          fi

      - name: Build source tarball
        run: make dist DISTDIR=pkg

      - name: Build Debian packages
        run: |
          version="$(make version)"
          mkdir -p pkg/build
          tar -xzf "pkg/yam-${version}.tar.gz" -C pkg/build
          cp -a pkg/debian "pkg/build/yam-${version}/debian"
          cd "pkg/build/yam-${version}"
          dpkg-buildpackage -us -uc -b

      - name: Collect Debian artifacts
        run: |
          mkdir -p dist
          cp pkg/build/*.deb dist/

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v6
        with:
          name: yam-deb
          path: dist/*.deb

  rpm:
    name: RPM packages
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc make rpm-build git

      - uses: actions/checkout@v5

      - name: Verify version matches tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(make version)"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match yam.h version v$version"
            exit 1
          fi

      - name: Build source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make dist DISTDIR=pkg

      - name: Build RPM packages
        run: |
          version="$(make version)"
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS
          cp "pkg/yam-${version}.tar.gz" ~/rpmbuild/SOURCES/
          cp pkg/yam.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/yam.spec

      - name: Collect RPM artifacts
        run: |
          mkdir -p dist
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v6
        with:
          name: yam-rpm
          path: dist/*.rpm

  release-assets:
    name: Attach packages to release
    if: github.event_name == 'release'
    needs: [arch, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yam-arch/*.pkg.tar.zst
            yam-deb/*.deb
            yam-rpm/*.rpm
